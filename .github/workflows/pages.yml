# Builds the game and publishes it to GitHub Pages.
#
# This runs as soon as Pages is switched on for the repo with its source set to
# "GitHub Actions" (Settings -> Pages -> Source). Until then the workflow is
# inert — it will queue and fail at the deploy step with a message saying Pages
# is not enabled, which is expected rather than broken.
#
# Note that Pages on a private repository needs a paid plan; on the free plan
# the repository has to be public first.
name: Deploy to Pages

on:
  push:
    branches: [main, 'claude/bouldering-puzzle-game-c770xg']
  # Pull requests get the same checks and a downloadable build; only pushes deploy.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once. A pull request's newer push cancels its older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The tests are most of CI's time: the sim climbs every route. They are split
  # across three runners that go at once, alongside the build.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # A pull request's build, to download and open locally.
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bruh-build
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
